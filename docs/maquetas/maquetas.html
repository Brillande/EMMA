<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Maquetas EMMA</title>
<!--
  Maquetas de las pestañas de EMMA con el estilo de la maqueta de «Inicio» (2026-11-14).
  Son imágenes de concepto: las cifras son de ejemplo y no salen del backend. Cada pestaña se
  abre con su ancla (#hazards, #routines…) y `capturar.ps1` las saca a PNG a 1672×941.
-->
<style>
:root{
  --bg:#050d1b; --pn:rgba(9,27,50,.78); --pn2:rgba(13,38,66,.85); --ln:#1d5f88; --ln2:#2a87b8;
  --tx:#e8f2ff; --tx2:#a9c0d8; --tx3:#7f97b2; --cy:#36d6ff; --ok:#3fd47e; --am:#f6b931; --rd:#ff4a4a;
  --R:#8f5cf7; --I:#2f86e6; --D:#17b6a4; --G:#e2a21b; --E:#43c24c; --mg:#e45bd0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1672px;height:941px;overflow:hidden}
body{font-family:"Segoe UI",system-ui,sans-serif;color:var(--tx);font-size:14px;
  background:
    radial-gradient(1px 1px at 12% 22%,#fff8,transparent 60%),radial-gradient(1px 1px at 33% 71%,#fff6,transparent 60%),
    radial-gradient(1px 1px at 58% 12%,#fff7,transparent 60%),radial-gradient(1.5px 1.5px at 78% 64%,#fff5,transparent 60%),
    radial-gradient(1px 1px at 91% 31%,#fff8,transparent 60%),radial-gradient(1px 1px at 46% 88%,#fff5,transparent 60%),
    radial-gradient(1200px 700px at 70% -10%,#0d2a4d 0%,transparent 60%),
    radial-gradient(900px 600px at 100% 100%,#0a2340 0%,transparent 60%),var(--bg);}
.app{display:grid;grid-template-columns:276px 1fr;grid-template-rows:62px 1fr;height:941px}
/* cabecera */
.hd{grid-column:1/3;display:flex;align-items:center;gap:18px;padding:0 18px 0 16px;border-bottom:1px solid #12395a;
  background:linear-gradient(180deg,#081a31,#06142a)}
.logo{display:flex;align-items:center;gap:10px;width:254px}
.logo svg{filter:drop-shadow(0 0 6px #36d6ff)}
.logo b{font-family:Bahnschrift,"Segoe UI";font-size:27px;letter-spacing:1px;line-height:1;display:block}
.logo small{display:block;font-size:11px;line-height:1.1;color:#dbe8f7}
.tag{border-left:2px solid #2a6f9a;padding-left:18px;font-size:19px;color:#cfe0f3;flex:1;white-space:nowrap}
.hd .ic{opacity:.95}
.badge{position:relative}.badge i{position:absolute;top:-6px;right:-7px;background:var(--rd);color:#fff;font:700 11px "Segoe UI";
  border-radius:9px;padding:0 5px;font-style:normal}
.who{border:1.5px solid #4a7aa3;border-radius:18px;padding:4px 14px;display:flex;gap:8px;align-items:center;font-size:16px}
.console-sw{display:flex;border:1px solid #2a6f9a;border-radius:16px;overflow:hidden;font-size:13px}
.console-sw span{padding:5px 12px;color:var(--tx2)}.console-sw .on{background:#11507a;color:#fff}
/* carril */
.rail{position:relative;padding:14px 12px 0;overflow:hidden;border-right:1px solid #10304d;
  background:linear-gradient(180deg,#071630 0%,#061226 100%)}
.rail a{display:flex;align-items:center;gap:14px;padding:11px 14px;font-size:17.5px;color:#e3eefb;
  border-bottom:1px solid #10304d;text-decoration:none;position:relative;z-index:2}
.rail a.on{background:linear-gradient(90deg,#127a94,#0e5876);border-radius:8px;border:1px solid #2bb6d8;
  box-shadow:0 0 14px #1fb5e066 inset,0 0 10px #1590c055}
.rail a .ic{width:24px;height:24px}
.rail .grp{font-size:11.5px;letter-spacing:.12em;color:var(--tx3);padding:12px 14px 4px;text-transform:uppercase}
.earth{position:absolute;left:-210px;bottom:-330px;width:620px;height:620px;border-radius:50%;z-index:1;
  background:radial-gradient(circle at 62% 30%,#2a6fb3 0%,#123e74 30%,#0a2347 55%,#051327 75%);
  box-shadow:0 0 50px 12px #2f8fe066,inset -30px 30px 80px #6fc6ff33}
.earth::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(2px 2px at 55% 40%,#ffd27a,transparent),radial-gradient(2px 2px at 60% 46%,#ffcf6e,transparent),
  radial-gradient(1.5px 1.5px at 66% 38%,#ffd88a,transparent),radial-gradient(2px 2px at 70% 52%,#ffcb66,transparent),
  radial-gradient(1.5px 1.5px at 52% 55%,#ffd27a,transparent),radial-gradient(2px 2px at 74% 44%,#ffcf6e,transparent),
  radial-gradient(1.5px 1.5px at 63% 60%,#ffd88a,transparent),radial-gradient(1.5px 1.5px at 48% 47%,#ffd27a,transparent)}
.mission{position:absolute;left:14px;right:14px;bottom:16px;z-index:3;font-size:12.5px;color:#cfe0f3;
  background:#061529cc;border:1px solid #1d5f88;border-radius:10px;padding:9px 12px;line-height:1.45}
.mission b{color:#fff}
/* principal */
.main{padding:12px 14px 12px 12px;display:grid;gap:10px;overflow:hidden;min-height:0}
.bar{display:flex;align-items:center;gap:14px;background:var(--pn);border:1px solid var(--ln);border-radius:10px;
  padding:8px 14px;box-shadow:0 0 12px #1ea7e022 inset}
.bar h1{font-size:21px;font-weight:600;display:flex;align-items:center;gap:10px}
.bar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #2a6f9a;border-radius:14px;padding:3px 11px;font-size:13px;color:#d7e7f8;background:#0a2140}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--ok);box-shadow:0 0 6px currentColor}
.grid{display:grid;gap:10px;min-height:0}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:9px 12px 10px;min-height:0;overflow:hidden;
  box-shadow:0 0 0 1px #0b2f4a inset,0 0 16px #1aa6e01c inset,0 0 8px #0a6fa022;display:flex;flex-direction:column;gap:7px}
.pn>h3{font-size:16.5px;font-weight:600;display:flex;align-items:center;gap:9px;white-space:nowrap}
.pn>h3 .sp{flex:1}.pn>h3 small{font-weight:400;color:var(--tx2);font-size:12.5px}
.pb{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px}
.in{background:var(--pn2);border:1px solid #1a5279;border-radius:8px;padding:8px 10px}
.row{display:flex;align-items:center;gap:10px}.row .sp{flex:1}
.col{display:flex;flex-direction:column;gap:6px}
.t2{color:var(--tx2)}.t3{color:var(--tx3);font-size:12.5px}.sm{font-size:12.5px}.xs{font-size:11.5px}
.big{font-family:Bahnschrift,"Segoe UI";font-size:34px;line-height:1}
.mid{font-family:Bahnschrift,"Segoe UI";font-size:22px;line-height:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #2f86b8;border-radius:7px;padding:4px 11px;font-size:13px;
  background:linear-gradient(180deg,#0f3a5e,#0b2b48);color:#e8f4ff;white-space:nowrap}
.btn.pri{background:linear-gradient(180deg,#1689ad,#0f6688);border-color:#38c5ea}
.btn.lnk{border:none;background:none;color:var(--cy);padding:0}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:11px;padding:1px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-ok{background:#1f9c55;color:#fff}.p-am{background:#f6b931;color:#1a1300}.p-rd{background:#e23b3b;color:#fff}
.p-ne{background:#173d60;color:#d7e7f8;border:1px solid #2a6f9a;font-weight:500}.p-gy{background:#3a4656;color:#d0d8e2}
.p-cy{background:#0b4a5e;color:#8fe9ff;border:1px solid #2bb6d8}.p-mg{background:#5a1d55;color:#ffc6f4;border:1px solid var(--mg)}
.lv{display:flex;align-items:center;gap:12px;border-radius:9px;padding:9px 12px;border:1.5px solid}
.lv.ok{background:linear-gradient(90deg,#0f5a37,#0c4a2e);border-color:#3fd47e}
.lv.am{background:linear-gradient(90deg,#5a4307,#3d2e07);border-color:#f6b931}
.lv.rd{background:linear-gradient(90deg,#5d1414,#3f0d0d);border-color:#ff4a4a}
.lv b{font-family:Bahnschrift;font-size:26px;letter-spacing:.5px}
.ridge{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:7px;font:700 17px Bahnschrift;color:#fff;flex:none}
.R{background:var(--R)}.I{background:var(--I)}.D{background:var(--D)}.G{background:var(--G)}.E{background:var(--E)}
.ridgec{border-radius:10px;padding:9px 11px;border:1.5px solid;display:flex;flex-direction:column;gap:6px}
.ridgec.R{background:linear-gradient(160deg,#3b2470,#24164a);border-color:var(--R)}
.ridgec.I{background:linear-gradient(160deg,#14365e,#0d2442);border-color:var(--I)}
.ridgec.D{background:linear-gradient(160deg,#0f4a48,#0a3030);border-color:var(--D)}
.ridgec.G{background:linear-gradient(160deg,#55400c,#352707);border-color:var(--G)}
.ridgec.E{background:linear-gradient(160deg,#1f4d16,#13310e);border-color:var(--E)}
.meter{height:8px;border-radius:5px;background:#0d2a46;overflow:hidden;border:1px solid #16466c}
.meter i{display:block;height:100%;border-radius:5px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{color:var(--tx3);font-weight:500;text-align:left;padding:3px 6px;border-bottom:1px solid #1a4a70;font-size:12px}
td{padding:4.5px 6px;border-bottom:1px solid #12385a}
.mono{font-family:Consolas,monospace;font-size:12px;color:#9fd8ff}
.ck{width:16px;height:16px;border:1.5px solid #6c8fb0;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ck.on{background:var(--ok);border-color:var(--ok)}
.filete{border-left:4px solid}
.tabsm{display:flex;gap:4px}.tabsm span{border:1px solid #2a6f9a;border-radius:6px;padding:2px 10px;font-size:12.5px;color:var(--tx2)}
.tabsm span.on{background:#11507a;color:#fff;border-color:#38c5ea}
.ph{border-radius:8px;border:1px solid #1a5279;position:relative;overflow:hidden;background:#020812}
.foot{font-size:11.5px;color:var(--tx3)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}.kv span:nth-child(odd){color:var(--tx2)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
/* ---------- iconos de línea ---------- */
const P={
 home:'M3 11 12 4l9 7M5 10v10h5v-6h4v6h5V10',
 alert:'M12 3 2 20h20L12 3zM12 10v5M12 17.5v.5',
 list:'M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1',
 body:'M12 3.5a2 2 0 1 1 0 .1M7 9h10M12 8v7M9 21l3-6 3 6M7 9l-2 6M17 9l2 6',
 globe:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18',
 sensor:'M4 12h3l2-5 4 10 2-5h5',
 book:'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5zM4 19a2 2 0 0 1 2-2h13',
 image:'M3 5h18v14H3zM3 16l5-5 4 4 3-3 6 6M15.5 8.5a1 1 0 1 0 0 .1',
 cal:'M4 6h16v14H4zM4 10h16M8 3v5M16 3v5',
 lib:'M4 4h4v16H4zM10 4h4v16h-4zM16 5l3.5-1 3 15-3.5 1z',
 inbox:'M3 13h5l2 3h4l2-3h5M5 5h14l2 8v6H3v-6z',
 hist:'M12 7v5l3 2M3.5 12a8.5 8.5 0 1 0 2.5-6M3 4v4h4',
 trend:'M3 17l6-6 4 4 8-8M15 7h6v6',
 chart:'M4 20V10M10 20V4M16 20v-7M21 20H3',
 hab:'M3 12a9 5 0 0 0 18 0 9 5 0 0 0-18 0M7 12h10M12 7v10',
 frame:'M12 3 3 8l9 5 9-5zM3 13l9 5 9-5',
 ledger:'M7 3h10v18H7zM10 7h4M10 11h4M10 15h4M4 6h3M4 18h3M17 6h3M17 18h3',
 bell:'M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20h4',
 help:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 16.5v.5',
 wifi:'M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5v.1',
 user:'M12 4a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM4 21a8 8 0 0 1 16 0',
 heart:'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z',
 rad:'M12 10.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M12 3a9 9 0 0 1 7.8 4.5L13.7 11M4.2 7.5A9 9 0 0 1 12 3M4.2 16.5 10.3 13M19.8 16.5 13.7 13M12 21v-7',
 shield:'M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z',
 check:'M5 12l4 4 10-10',
 clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2',
 link:'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1',
 drop:'M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z',
 thermo:'M10 4a2 2 0 0 1 4 0v10a4 4 0 1 1-4 0z',
 lungs:'M12 4v8M12 10c-2 0-3-2-5-2-2 0-3 4-3 8 0 2 1 4 3 4s5-2 5-6M12 10c2 0 3-2 5-2 2 0 3 4 3 8 0 2-1 4-3 4s-5-2-5-6',
 doc:'M6 3h9l4 4v14H6zM15 3v4h4M9 12h7M9 16h7',
 cube:'M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12 4 7.5',
 msg:'M4 5h16v11H9l-5 4z',
 search:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM16 16l5 5',
 brain:'M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V5a3 3 0 0 0-3-1zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1',
 food:'M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M16 3c-2 2-2 7 0 9v9',
 bt:'M7 7l10 10-5 4V3l5 4L7 17',
 sat:'M4 14l6 6M7 11l6 6M10 8l6 6 4-4-6-6zM2 20l3-3',
 lock:'M6 11h12v10H6zM8 11V8a4 4 0 0 1 8 0v3',
 down:'M6 9l6 6 6-6',
 right:'M9 6l6 6-6 6',
 plus:'M12 5v14M5 12h14',
 moon:'M20 14A8 8 0 1 1 10 4a6.5 6.5 0 0 0 10 10z',
 send:'M3 11 21 3l-8 18-2-8z',
 printer:'M7 8V3h10v5M5 8h14v8H5zM7 14h10v7H7z',
 star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z',
 eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6'
};
const ic=(n,c='#7fdcff',s=20,w=1.8)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"><path d="${P[n]}"/></svg>`;

/* ---------- utilidades ---------- */
let seed=7;const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
function spark(w,h,c,{base=.5,amp=.35,n=60,wave=0,fill=false,band=null,s=3}={}){
  seed=s*977+11;let pts=[];for(let i=0;i<n;i++){const x=i/(n-1)*w;
   let v=base+(wave?Math.sin(i/n*Math.PI*2*wave)*amp*.6:0)+(rnd()-.5)*amp;v=Math.max(.05,Math.min(.95,v));pts.push([x,h-v*h]);}
  const d=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;overflow:visible;max-width:${w}px">
   ${band?`<rect x="0" y="${h-band[1]*h}" width="${w}" height="${(band[1]-band[0])*h}" fill="#36d6ff" opacity=".10"/>`:''}
   ${fill?`<polygon points="0,${h} ${d} ${w},${h}" fill="${c}" opacity=".16"/>`:''}
   <polyline points="${d}" fill="none" stroke="${c}" stroke-width="1.8" vector-effect="non-scaling-stroke" style="filter:drop-shadow(0 0 3px ${c})"/></svg>`;
}
function axes(w,h,ylab,xlab){let g='';ylab.forEach((t,i)=>{const y=i/(ylab.length-1)*h;
  g+=`<line x1="30" x2="${w}" y1="${y}" y2="${y}" stroke="#1b4b72" stroke-dasharray="2 4"/><text x="0" y="${y+4}" fill="#9fb6cf" font-size="11">${t}</text>`});
  xlab.forEach((t,i)=>{const x=30+i/(xlab.length-1)*(w-50);g+=`<text x="${x}" y="${h+15}" fill="#9fb6cf" font-size="11">${t}</text>`});return g;}
function chart(w,h,series,ylab,xlab,opt={}){
  let s='';series.forEach((sr,k)=>{seed=sr.s*991+3;const n=sr.n||70;let d='';
   for(let i=0;i<n;i++){const x=30+i/(n-1)*(w-34);let v=sr.base+(sr.slope||0)*i/n+(rnd()-.5)*sr.amp+(sr.wave?Math.sin(i/4)*sr.wave:0);
    d+=`${x.toFixed(1)},${(h-v*h).toFixed(1)} `;}
   s+=`<polyline points="${d}" fill="none" stroke="${sr.c}" stroke-width="1.8" ${sr.dash?'stroke-dasharray="5 4"':''} style="filter:drop-shadow(0 0 3px ${sr.c})"/>`});
  const band=opt.band?`<rect x="30" y="${h-opt.band[1]*h}" width="${w-34}" height="${(opt.band[1]-opt.band[0])*h}" fill="#3fd47e" opacity=".10" stroke="#3fd47e55" stroke-dasharray="3 3"/>`:'';
  const mark=opt.mark?`<line x1="${opt.mark*w}" x2="${opt.mark*w}" y1="0" y2="${h}" stroke="#f6b931" stroke-dasharray="4 3"/><text x="${opt.mark*w+4}" y="11" fill="#f6b931" font-size="11">${opt.markt||''}</text>`:'';
  return `<svg width="${w}" height="${h+18}" style="display:block;overflow:visible">${axes(w,h,ylab,xlab)}${band}${mark}${s}</svg>`;
}
const meter=(p,c)=>`<div class="meter"><i style="width:${p}%;background:${c};box-shadow:0 0 6px ${c}"></i></div>`;
const ring=(v,max,c,size=96,lab='')=>{const r=size/2-8,C=2*Math.PI*r,f=v/max;return `<svg width="${size}" height="${size}">
 <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#123a5c" stroke-width="9" fill="none"/>
 <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${c}" stroke-width="9" fill="none" stroke-linecap="round"
  stroke-dasharray="${C*f} ${C}" transform="rotate(-90 ${size/2} ${size/2})" style="filter:drop-shadow(0 0 5px ${c})"/>
 <text x="50%" y="48%" text-anchor="middle" fill="#fff" font-family="Bahnschrift" font-size="${size*.27}">${lab||v}</text>
 <text x="50%" y="66%" text-anchor="middle" fill="#9fb6cf" font-size="11">/ ${max}</text></svg>`};
const pn=(area,icon,title,body,{extra='',cls='',c='#7fdcff'}={})=>
 `<section class="pn ${cls}" style="grid-area:${area}"><h3>${ic(icon,c,20)} ${title}<span class="sp"></span>${extra}</h3><div class="pb">${body}</div></section>`;
const ck=(on,t,m='')=>`<div class="row sm"><span class="ck ${on?'on':''}">${on?ic('check','#fff',12,3):''}</span><span>${t}</span><span class="sp"></span><span class="t3">${m}</span></div>`;
const lvl={ok:['p-ok','Normal'],am:['p-am','Precaución'],rd:['p-rd','Alerta'],gy:['p-gy','No disponible'],cy:['p-cy','Caducado']};
const L=(k,t)=>`<span class="pill ${lvl[k][0]}">${t||lvl[k][1]}</span>`;

/* ---------- figura holográfica (dibujo, no dato) ---------- */
function figure(h=330,mark=null){
 return `<svg width="${h*.5}" height="${h}" viewBox="0 0 100 200" style="filter:drop-shadow(0 0 8px #36a8ff)">
 <defs><radialGradient id="th" cx="50%" cy="34%" r="60%"><stop offset="0" stop-color="#ff2a1a"/><stop offset=".16" stop-color="#ffb21a"/>
  <stop offset=".32" stop-color="#d8ff2a"/><stop offset=".5" stop-color="#2aff9a"/><stop offset=".72" stop-color="#1aa8ff"/><stop offset="1" stop-color="#1a4dff"/></radialGradient>
  <linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2affb0"/><stop offset=".5" stop-color="#1ab4ff"/><stop offset="1" stop-color="#1a50ff"/></linearGradient></defs>
 <g stroke="#9fe8ff" stroke-width=".6" stroke-opacity=".7">
 <ellipse cx="50" cy="15" rx="8.5" ry="10.5" fill="url(#lg)"/>

function shell(key,tab){

 return `<header class="hd"><div class="logo">
   <svg width="62" height="46" viewBox="0 0 62 46"><ellipse cx="31" cy="23" rx="28" ry="19" fill="none" stroke="#36d6ff" stroke-width="2.4"/>
   <path d="M6 24h12l4-9 5 17 5-22 4 14h20" fill="none" stroke="#7fe9ff" stroke-width="2.2"/></svg>
   <div><b>EMMA</b><small>Environment and Medical<br>Monitoring Assistant</small></div></div>
  <div class="tag">${ground?'Consola de Tierra · Seguimiento con el retardo de la señal':'Monitorización · Prevención · Rendimiento · Salud de la Tripulación'}</div>
  <div class="console-sw"><span class="${ground?'':'on'}">A bordo</span><span class="${ground?'on':''}">Tierra</span></div>
  ${ic('wifi','#e8f2ff',26)}<span class="badge">${ic('bell','#f6b931',26)}<i>${ground?2:1}</i></span>${ic('help','#e8f2ff',26)}
  <div class="who">${ic('user','#e8f2ff',18)} ${ground?'Cirujano de vuelo':'C-01'}</div></header>
 <nav class="rail">${ground?'<div class="grp">Consola de Tierra</div>':''}
  ${list.map(([k,i,l])=>`<a class="${k===key?'on':''}">${ic(i,k===key?'#ffffff':'#8fd8ff',24)}<span>${l}</span></a>`).join('')}
  <div class="earth"></div>
  <div class="mission"><b>Entorno: ISS · LEO</b><br>Día de misión 134 · Expedición 74<br>${ground?'Señal ida: <b>0,0 s</b> (sin retardo en LEO)':'Último enlace con Tierra: hace 6 min'}</div>
 </nav>
 <main class="main" style="grid-template-rows:auto 1fr">
  <div class="bar"><h1>${ic(tab.icon,'#36d6ff',24)} ${tab.title}</h1><span class="t2 sm">${tab.sub||''}</span><span class="sp"></span>${tab.chips||''}
   <span class="chip"><span class="dot"></span> Última actualización: hace 1 min</span></div>
  <div class="grid" style='grid-template-columns:${tab.cols};grid-template-rows:${tab.rows};grid-template-areas:${tab.areas}'>${tab.body()}</div>
 </main>`;
}

      ['13 nov 09:15','C-01','R','Contramedida adoptada: refugio en el pico','ne','C-01'],['12 nov 18:02','C-03','E','Aviso de CO₂ resuelto','ok','Sistema'],['12 nov 11:40','C-02','G','Ejercicio ARED completado','ok','C-02'],
      ['11 nov 21:05','C-01','D','Contramedida adoptada: higiene de sueño','ne','C-01'],['11 nov 08:00','—','E','Evento declarado: aumento de flujo de protones','am','C-04'],['10 nov 16:22','C-04','I','Muestra de cortisol analizada','ok','Sistema'],
      ['9 nov 13:30','C-02','D','Batería cognitiva dentro de base','ok','Sistema'],['8 nov 10:10','—','E','Enlace con Tierra restablecido','ok','Sistema'],['7 nov 19:45','C-03','G','Molestia lumbar registrada (3/10)','am','C-03']].map(([a,b,k,d,l,w])=>
   `<tr><td class="t2">${a}</td><td>${b}</td><td><span class="ridge ${k}" style="width:22px;height:22px;font-size:13px">${k}</span></td><td>${d}</td><td>${l==='ne'?'<span class="pill p-ne">Decisión</span>':L(l)}</td><td class="t2">${w}</td></tr>`).join('')}</table>`)
 +pn('side','chart','En 7 días',`${[['Alertas','4','#f6b931'],['Reconocidas','3','#3fd47e'],['Contramedidas adoptadas','2','#36d6ff'],['Eventos declarados','1','#8f5cf7']].map(([t,v,c])=>
   `<div class="in"><div class="t3">${t}</div><div class="big" style="color:${c}">${v}</div></div>`).join('')}<div class="t3">Cada fila sale del registro firmado; nada se edita.</div>`)};

T.trends={icon:'trend',title:'Tendencias',sub:'C-01 · comparado con su línea base',
 chips:'<div class="tabsm"><span>48 h</span><span class="on">7 d</span><span>Misión</span></div><span class="chip">Tripulante: <b>C-01</b> '+ic('down','#a9c0d8',14)+'</span>',
 cols:'1fr 1fr',rows:'1fr 1fr 1fr',areas:'"a b" "c d" "e f"',
 body:()=>[['a','heart','FC en reposo',['70','60','50'],{s:1,base:.45,amp:.12,c:'#ff6a6a'},[.3,.6],'58 bpm','ok'],
   ['b','heart','Variabilidad (RMSSD)',['70','50','30'],{s:2,base:.5,amp:.2,slope:-.12,c:'#36d6ff'},[.35,.75],'49 ms','ok'],
   ['c','moon','Eficiencia de sueño',['95 %','85 %','75 %'],{s:3,base:.5,amp:.2,slope:-.2,c:'#2f86e6'},[.45,.85],'81 %','am'],
   ['d','clock','PVT · mediana',['320','280','240'],{s:4,base:.35,amp:.15,slope:.3,c:'#f6b931'},[.2,.6],'280 ms','am'],
   ['e','rad','Dosis diaria',['0,8','0,5','0,2'],{s:5,base:.4,amp:.1,slope:.3,c:'#8f5cf7'},[.2,.6],'0,65 mSv','am'],
   ['f','thermo','Temperatura de piel',['37,4','36,8','36,2'],{s:6,base:.5,amp:.2,c:'#43c24c'},[.3,.7],'36,7 °C','ok']].map(([a,i,t,y,sr,b,v,l])=>
   pn(a,i,t,`${chart(640,108,[{...sr,n:84}],y,['8 nov','10 nov','12 nov','14 nov'],{band:b})}`,{extra:`<b>${v}</b> ${L(l)} <small>banda verde: línea base</small>`})).join('')};

T.ghabitat={icon:'hab',title:'Hábitat',sub:'Entorno de la estación y resumen de bienestar',
 cols:'1fr 1fr 1fr',rows:'1fr 1fr',areas:'"env env env" "leis tasks msgs"',
 body:()=>pn('env','hab','Entorno por módulo',`<table><tr><th>Módulo</th><th>CO₂</th><th>Temperatura</th><th>Humedad</th><th>Ruido</th><th>ppO₂</th><th>Tendencia CO₂ (7 d)</th></tr>
   ${[['Columbus','2,9 mmHg','22,4 °C','41 %','58 dBA','21,3 kPa','ok'],['Destiny','3,4 mmHg','23,1 °C','44 %','61 dBA','21,1 kPa','am'],['Harmony (dormitorios)','3,1 mmHg','22,0 °C','43 %','52 dBA','21,2 kPa','ok'],['Kibo','2,7 mmHg','22,8 °C','40 %','57 dBA','21,4 kPa','ok'],['Unity','—','—','—','—','—','gy']].map(([m,...r])=>{const l=r.pop();
   return `<tr><td><b>${m}</b></td>${r.map((c,i)=>`<td style="${i==0&&l==='am'?'color:#f6b931':''}">${c}</td>`).join('')}<td>${l==='gy'?L('gy'):spark(220,24,l==='am'?'#f6b931':'#43c24c',{s:m.length,amp:.4})}</td></tr>`}).join('')}</table>`,{c:'#43c24c'})
 +pn('leis','star','Ocio en el calendario',`<div class="t3">Horas por semana · apoyo psicológico</div><div class="row" style="align-items:flex-end;gap:10px;height:120px">
   ${[['C-01',6.5],['C-02',8],['C-03',4],['C-04',7]].map(([c,h])=>`<div class="col" style="flex:1;align-items:center;gap:4px"><b class="sm">${h} h</b><i style="width:100%;height:${h*11}px;border-radius:5px 5px 0 0;background:linear-gradient(#e45bd0,#5a1d55)"></i><span class="t3">${c}</span></div>`).join('')}</div>`,{c:'#e45bd0'})
 +pn('tasks','check','Tareas y rachas',`${[['C-01','9 días','12 hechas'],['C-02','14 días','15 hechas'],['C-03','2 días','6 hechas'],['C-04','7 días','10 hechas']].map(([c,r,t])=>`<div class="in row sm"><b>${c}</b><span class="t2">${t}</span><span class="sp"></span>${ic('star','#f6b931',14)}<b>${r}</b></div>`).join('')}`,{c:'#3fd47e'})
 +pn('msgs','msg','Mensajes y recordatorios',`${[['Mensajes entre la tripulación','38','esta semana'],['Recordatorios creados','11','esta semana'],['Pasatiempos anotados','Lectura, juegos, fotografía','']].map(([t,v,s])=>`<div class="in"><div class="t3">${t}</div><div class="row"><b class="${v.length<4?'mid':'sm'}">${v}</b><span class="t3">${s}</span></div></div>`).join('')}
   <div class="t3">Solo recuentos: el contenido de los mensajes no baja a Tierra.</div>`)};

T.framework={icon:'frame',title:'Marco y fuentes',sub:'Qué norma se sigue y de dónde sale cada dato',
 cols:'1fr 1fr 1fr',rows:'1fr 1fr',areas:'"norm ev src" "norm ev src"',
 body:()=>pn('norm','shield','Marco normativo',`${[['NASA-STD-3001 Vol. 2','Interfaz: Apéndice F (colores y estados)'],['IEC 62304','Desarrollado conforme a Clase B; borrador del modelo local en Clase C'],['ISO 14971','Archivo de gestión de riesgos'],['HL7 FHIR R4','Toda medida como Observation'],['LOINC','Códigos verificados en su ficha oficial']].map(([t,d])=>
   `<div class="in col" style="gap:3px"><b class="sm">${t}</b><span class="t2 xs">${d}</span></div>`).join('')}<div class="in xs" style="border-color:#f6b931">No está certificado: no reclama certificación de un organismo notificado.</div>`)
 +pn('ev','book','Respaldo del modelo',`<div class="t3">Cada parámetro del simulador declara su respaldo</div>
   <div class="row" style="gap:8px">${[['Magnitud documentada','14','#3fd47e'],['Sentido documentado','9','#36d6ff'],['Contestado','4','#f6b931']].map(([t,v,c])=>`<div class="in col" style="flex:1;gap:2px"><div class="big" style="color:${c}">${v}</div><span class="xs t2">${t}</span></div>`).join('')}</div>
   <table><tr><th>Parámetro</th><th>Respaldo</th></tr>${[['Deriva de FC en reposo','Magnitud documentada'],['Caída de SDNN en vuelo','Sin respaldo · no se usa'],['Pérdida ósea mensual','Magnitud documentada'],['Factor de calidad Q','Medido · DosTel'],['Cambio de cortisol','Contestado']].map(r=>`<tr><td>${r[0]}</td><td class="t2">${r[1]}</td></tr>`).join('')}</table>`,{c:'#3fd47e'})
 +pn('src','globe','Fuentes de datos',`${[['SPICE (núcleo de432s)','Tiempo de luz · local','ok'],['JPL Horizons','Contraste y respaldo','ok'],['NASA DONKI','Clima espacial','ok'],['NASA OSDR','Estudios de referencia','ok'],['HRP Evidence','Riesgos y contramedidas','ok'],['MMASH','Validación en Tierra (sanos)','ok'],['Datos de vitales de astronautas','No existe API pública','gy']].map(([t,d,l])=>
   `<div class="in row"><div class="col" style="gap:1px"><b class="sm">${t}</b><span class="t3">${d}</span></div><span class="sp"></span>${L(l,l==='ok'?'Disponible':'No disponible')}</div>`).join('')}
   <div class="t3">Solo entran datos: ninguna consulta lleva información de la tripulación.</div>`)};

T.ledger={icon:'ledger',title:'Registro y documentos',sub:'Log encadenado y firmado',
 chips:`<span class="chip" style="border-color:#3fd47e;color:#9ff0c0">${ic('lock','#3fd47e',14)} Integridad verificada · 4 812 asientos</span>`,
 cols:'1.5fr 1fr',rows:'auto 1fr',areas:'"chain docs" "tab docs"',
 body:()=>pn('chain','link','Cadena',`<div class="row" style="gap:6px">${['a41f…9c','7be0…12','c3d9…e8','09fa…5b','e612…a0'].map((h,i)=>
   `<div class="in col" style="flex:1;gap:2px;${i==4?'border-color:#38c5ea;box-shadow:0 0 10px #36d6ff44 inset':''}"><span class="t3">#${4808+i}</span><span class="mono">${h}</span><span class="xs" style="color:#3fd47e">${ic('check','#3fd47e',12,3)} firma</span></div>${i<4?ic('right','#2a87b8',18):''}`).join('')}</div>`,{c:'#3fd47e'})
 +pn('tab','list','Últimos asientos',`<table><tr><th>#</th><th>Hora</th><th>Tipo</th><th>Firmado por</th><th>Huella</th></tr>
   ${[['4812','10:02','observation · FC','emma-ingest','e612…a0'],['4811','09:58','alert-ack','C-01','09fa…5b'],['4810','09:41','countermeasure-adopt','C-01','c3d9…e8'],['4809','09:30','observation · SpO₂','emma-ingest','7be0…12'],['4808','09:12','ground-note','Cirujano de vuelo','a41f…9c'],['4807','08:00','ephemeris','emma-ephemeris','5d22…71'],['4806','07:45','observation · masa','emma-ingest','b08c…3e'],['4805','07:30','diary','C-01','f1a7…c4']].map(r=>
   `<tr>${r.map((c,i)=>`<td class="${i==4?'mono':i==0||i==1?'t2':''}">${c}</td>`).join('')}</tr>`).join('')}</table>`)
 +pn('docs','doc','Documentos',`${[['Especificación del registro','record-integrity.md'],['Clasificación de seguridad del software','software-safety-classification.md'],['Gestión de riesgos','risk-management-file.md'],['Validación externa','external-validation.md'],['Estado del arte de la interfaz','hmi-state-of-the-art.md'],['Informe de exportación del registro','JSON firmado']].map(([t,f])=>
   `<div class="in row"><span>${ic('doc','#7fdcff',18)}</span><div class="col" style="gap:1px"><b class="sm">${t}</b><span class="t3">${f}</span></div><span class="sp"></span>${ic('right','#7fdcff',16)}</div>`).join('')}
   <span class="btn">Exportar registro verificable</span>`)};

T.glibrary={...T.library};
