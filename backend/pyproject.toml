[project]
name = "emma-backend"
version = "0.1.8"
description = "EMMA — Environment and Medical Monitoring Assistant. Monitoreo autonomo de salud para misiones de larga duracion."
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Datos de salud: modelo canonico FHIR R4
    "fhir.resources>=7.1",
    # Analisis de series fisiologicas
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    # Fuentes externas
    "httpx>=0.27",
    "astroquery>=0.4.7",       # solo jplhorizons: efemerides -> tiempo de luz
    # Persistencia
    "sqlalchemy>=2.0",
    # Integridad de registros (log encadenado por hash + firma)
    "cryptography>=43.0",
    # Ecografia: lectura, calibracion y des-identificacion de DICOM (licencia MIT)
    "pydicom>=3.0",
    # Descodificar fotogramas JPEG y servirlos como PNG a la interfaz (licencia MIT-CMU)
    "pillow>=11",
    # Rasterizar PDF escaneados para el OCR de informes (app/reports/). BSD-3 o Apache-2.0.
    "pypdfium2>=4.30",
    # Visor 3D de volúmenes (app/volumes/, de Polaris): NIfTI (MIT) y marching cubes (BSD-3).
    "nibabel>=5",
    "scikit-image>=0.24",
    # Herramientas de Polaris copiadas tal cual (polaris/): PDF con md_to_pdf_pro (BSD) y lectura
    # de PDF de la biblioteca local kb.py (BSD-3).
    "reportlab>=4",
    "pypdf>=5",
    # Búsqueda semántica local de kb_embed (Polaris): el modelo e5-small en ONNX, en CPU, sin red.
    # onnxruntime (MIT) y tokenizers (Apache-2.0).
    "onnxruntime>=1.30",
    "tokenizers>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",             # mock de httpx: tests sin red
    "ruff>=0.7",
    "mypy>=1.13",
]

# Solo para empaquetar la aplicacion de escritorio: congela el backend en un
# ejecutable. No se ejecuta en produccion, pero produce lo que se entrega.
desktop = [
    "pyinstaller>=6.10",
]

# Solo para la pasarela de anclas de modulo (scripts/anchor_gateway.py): escucha
# pasiva de balizas BLE de la nave. Opcional y fuera de dev: sin ella la escucha
# en vivo se declara no disponible. bleak (MIT).
anchors = [
    "bleak>=0.22",
]

# Calculo local del tiempo de luz y la elongacion solar con SPICE (NAIF, JPL) para los dias sin
# efemeride de Horizons en cache (app/environment/spice.py). Opcional: sin ella, "SPICE no
# instalado" y todo sigue con Horizons y su cache. spiceypy (MIT) incluye CSPICE de NAIF. Los
# nucleos se bajan aparte: scripts/fetch_spice_kernels.py.
spice = [
    "spiceypy==8.3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: pruebas que golpean APIs externas reales (excluidas de CI)",
    "external: validacion contra datasets externos descargados (excluidas de CI)",
]
addopts = "-m 'not live and not external'"

[tool.ruff]
line-length = 100
target-version = "py311"
# El entorno de TotalSegmentator (torch y sus dependencias) no es código de EMMA.
extend-exclude = [".venv-seg"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# El venv corre 3.12 y los stubs de numpy usan sintaxis de type statement.
python_version = "3.12"
strict = true
ignore_missing_imports = true
